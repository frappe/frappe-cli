[project]
name = "frappe-cli"
version = "0.12.1"
description = "frappe — a command-line client for Frappe sites, built for humans and AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ankush Menat", email = "ankush@frappe.io" }]
requires-python = ">=3.10"
keywords = ["frappe", "erpnext", "cli", "api"]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "keyring>=24.0",
    "authlib>=1.3",
]

[project.urls]
Homepage = "https://github.com/ankush/frappe-cli"

[project.scripts]
frappe-cli = "frappe_cli.cli:main"
# `fr` was the original entry point; keep it as an alias for backwards compatibility.
fr = "frappe_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frappe_cli"]

[tool.mypy]
# The package source is type-checked in strict mode: any regression in coverage
# (a missing annotation, an untyped call, an implicit Any) fails the build. Tests
# are intentionally excluded — they exercise error paths and monkeypatching where
# full annotation coverage costs more than it buys.
python_version = "3.10"
files = ["src"]
strict = true

# Authlib ships no type information; treat its imports as untyped rather than
# failing the strict build. Our own call sites stay fully typed around it.
[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end tests that hit a live Frappe site (skipped unless FRAPPE_SITE is set).",
]
