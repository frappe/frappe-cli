name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: "3.14"

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # The integration suite runs on pull requests (and manual dispatches) but not
  # on push, so branch pushes stay fast. Its result is rolled up by the `ci`
  # gate job below.
  integration:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # tmpfs for the datadir keeps the ephemeral CI DB fast (mirrors Frappe's own CI).
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # The site the CLI talks to. Served as the bench's default site, so the
      # CLI can reach it over plain 127.0.0.1 without any /etc/hosts juggling.
      SITE: test.localhost

    steps:
      - name: Checkout frappe-cli
        uses: actions/checkout@v7

      # --- The CLI under test (managed by uv, isolated from the bench env) ---
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: "3.14"

      - name: Install frappe-cli
        run: uv sync --extra dev

      # --- Toolchain for provisioning a Frappe bench ---
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Warm yarn's download cache so `bench init` installs frappe's node deps
      # from disk instead of re-fetching them from the registry every run. The
      # run_id in the key always writes a fresh cache; restore-keys pulls the
      # newest prior one so it stays current as frappe's deps drift.
      - name: Cache yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \

      - name: Install Bench
        run: |
          uv tool install frappe-bench
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision a Frappe site
        run: |
          set -euo pipefail

          bench init --skip-assets --no-backups \
            --skip-redis-config-generation \
            --frappe-branch develop ~/frappe-bench
          cd ~/frappe-bench

          # Point every redis role at the service container instead of bench's
          # own bundled redis, so we don't need honcho/`bench start` running.
          bench set-config -g redis_cache    "redis://localhost:6379"
          bench set-config -g redis_queue    "redis://localhost:6379"
          bench set-config -g redis_socketio "redis://localhost:6379"
          bench set-config -g use_mysqlclient 0

          # DB root creds + admin password via global config — the path Frappe's
          # own CI uses, rather than the (renamed) new-site CLI flags.
          bench set-config -g root_login root
          bench set-config -g root_password root
          bench set-config -g admin_password admin

          bench new-site "$SITE" \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-name test_frappe \
            --db-password test_frappe \
            --verbose
          bench use "$SITE"

      - name: Generate Administrator API keys
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          bench --site "$SITE" execute \
            frappe.core.doctype.user.user.generate_keys \
            --kwargs '{"user": "Administrator"}' > keys.out
          python - <<'PY'
          import json, os, re
          raw = open(os.path.expanduser("~/frappe-bench/keys.out")).read()
          match = re.search(r'\{[^{}]*"api_secret"[^{}]*\}', raw, re.S)
          keys = json.loads(match.group(0))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"FRAPPE_API_KEY={keys['api_key']}\n")
              env.write(f"FRAPPE_API_SECRET={keys['api_secret']}\n")
          PY

      - name: Serve the site
        run: |
          cd ~/frappe-bench
          bench start &
          for i in $(seq 1 30); do
            if curl -sf http://test.localhost:8000/api/method/ping >/dev/null; then
              echo "site is up"; exit 0
            fi
            sleep 2
          done
          echo "site did not come up in time" >&2
          exit 1

      - name: Run integration tests
        run: uv run pytest tests/integration -m integration -v
        env:
          FRAPPE_SITE: http://test.localhost:8000

  # Single roll-up status check — make THIS the only required check in the
  # ruleset. It aggregates the individual jobs so the required-checks list never
  # has to be maintained. `!cancelled()` lets it run even when integration is
  # skipped (on push); it then fails unless every job that should have run for
  # this event succeeded.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test, pre-commit, integration]
    if: ${{ !cancelled() }}
    steps:
      - name: Verify all checks passed
        run: |
          echo "test=${{ needs.test.result }} pre-commit=${{ needs['pre-commit'].result }} integration=${{ needs.integration.result }} (event=${{ github.event_name }})"

          # Unit tests and linters must pass on every event.
          [ "${{ needs.test.result }}" = "success" ] || { echo "::error::unit tests failed"; exit 1; }
          [ "${{ needs['pre-commit'].result }}" = "success" ] || { echo "::error::pre-commit failed"; exit 1; }

          # Integration runs on everything except push; require it there, ignore
          # its (skipped) result on push.
          if [ "${{ github.event_name }}" != "push" ]; then
            [ "${{ needs.integration.result }}" = "success" ] || { echo "::error::integration tests failed"; exit 1; }
          fi

          echo "All required checks passed."
